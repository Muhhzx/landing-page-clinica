# Deploy no Netlify (plano gratuito)
[build]
  command = "npm run build"
  publish = "dist/clinica-aurora/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA: qualquer rota (/painel, /privacidade...) cai no index.html e o Angular Router resolve.
# Arquivos que existem de verdade (robots.txt, sitemap.xml, js, css) são servidos normalmente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Arquivos com hash no nome podem ficar em cache por 1 ano.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
